[project]
name = "llm-eval-quality-gate"
version = "0.1.0"
description = "Evaluation harness and CI quality gate for LLM apps: RAG, agents and security."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["evalgate"]
