name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Harness tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      # Refuses a dataset that was edited instead of versioned.
      - run: python -m evalgate dataset verify v1

  quality-gate:
    name: Quality gate
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      # GitHub's runners can't run the local models, so the gate re-scores the run that
      # was recorded on a laptop (runs/current), with today's checks and the recorded
      # judge verdicts, then compares it with the accepted baseline.
      - name: Re-score the recorded run
        run: python -m evalgate rescore runs/current
      - name: Gate against the baseline
        run: python -m evalgate gate runs/current
